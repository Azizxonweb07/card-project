<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-project">
      <div class="card-top">
        <h2>Patient Visit By Department</h2>
        <select>
          <option value="Weekly">Weekly</option>
        </select>
      </div>
      <div class="card-bottom">
        <div class="card-bottom_left">
          <div class="circle">
            <div class="circle-center">
              <b>Overall<br /><small>70%</small></b>
            </div>
          </div>
        </div>
        <div class="card-right">
          <ul class="card-list">
            <li>
              <div class="circle-color"></div>
              <div class="circle-title">Cardiology<br /><span>40%</span></div>
            </li>
            <li>
              <div class="circle-color"></div>
              <div class="circle-title">Neurology<br /><span>20%</span></div>
            </li>
            <li>
              <div class="circle-color"></div>
              <div class="circle-title">Dermatology<br /><span>30%</span></div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
